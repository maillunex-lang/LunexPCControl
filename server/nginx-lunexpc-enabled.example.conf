# NOT for deployment until the readiness checks in docs/HTTPS.md pass.
# Include inside the existing rikagro.ru HTTPS server block.
location = /lunexpc { return 404; }
location ^~ /lunexpc/ {
    # Only forward the exact device MCP route. Other paths must be rejected
    # by the Python gateway as well. No redirects to a login page.
    client_max_body_size 4m;
    client_body_timeout 15s;
    limit_except GET POST DELETE { deny all; }
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:18880/devices/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_set_header Upgrade "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_redirect off;
    proxy_intercept_errors off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
