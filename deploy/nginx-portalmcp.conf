# LunexPCControl private authenticated HTML portal.
# Place in the *existing HTTPS server block* for rikagro.ru.
# The panel itself always listens on loopback and independently verifies
# Host, Basic credentials, and same-origin mutations.
# IMPORTANT: Do NOT publish the MCP gateway's /lunexpc route.
location = /portalmcp {
    return 308 /portalmcp/;
}
location ^~ /portalmcp/ {
    # Preserve browser Authorization; never substitute an upstream MCP secret.
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:18881/;
    proxy_set_header Host rikagro.ru;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    client_max_body_size 2k;
    limit_req zone=lunexpc_portal burst=15 nodelay;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
