# Include inside the existing HTTPS rikagro.ru server only.
# The raw MCP gateway remains closed to public access.
# The two controlled entry points are the owner portal and the
# OAuth/PKCE-protected read-only ChatGPT MCP bridge.
location = /lunexpc { return 404; }
location ^~ /lunexpc/ {
    return 404;
}

include /etc/nginx/snippets/lunexpc-portal.conf;
include /etc/nginx/snippets/lunexpc-chatgpt-alpha.conf;
include /etc/nginx/snippets/lunexpc-oauth.conf;
