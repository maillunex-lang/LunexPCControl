# Include in the existing HTTPS server for rikagro.ru.
# Exact endpoint only. Old /lunexpc and /lunexpc/ remain 404.
# OAuth2/PKCE bridge accepts scoped OAuth tokens and the legacy alpha key.
# The private gateway still independently limits tools to read-only.
# OAuth server listens only on 127.0.0.1:18882.
location = /lunexpc-mcp {
    limit_except POST { deny all; }
    auth_basic off;
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:18882/lunexpc-mcp;
    proxy_set_header Host rikagro.ru;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    client_max_body_size 128k;
    limit_req zone=lunexpc_portal burst=15 nodelay;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
}
location ^~ /lunexpc-mcp/ { return 404; }
