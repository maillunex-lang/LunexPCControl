# OAuth 2.1 discovery and owner authorization for the existing MCP endpoint.
# These are not the HTML portal and do not share its Basic auth challenge.
# Include only in the HTTPS server block for rikagro.ru.
location = /.well-known/oauth-authorization-server {
    auth_basic off;
    proxy_pass http://127.0.0.1:18882;
    proxy_set_header Host rikagro.ru;
    proxy_set_header Authorization "";
    proxy_http_version 1.1;
    limit_req zone=lunexpc_portal burst=15 nodelay;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /.well-known/oauth-protected-resource {
    auth_basic off;
    proxy_pass http://127.0.0.1:18882;
    proxy_set_header Host rikagro.ru;
    proxy_set_header Authorization "";
    proxy_http_version 1.1;
    limit_req zone=lunexpc_portal burst=15 nodelay;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /.well-known/oauth-protected-resource/lunexpc-mcp {
    auth_basic off;
    proxy_pass http://127.0.0.1:18882;
    proxy_set_header Host rikagro.ru;
    proxy_set_header Authorization "";
    proxy_http_version 1.1;
    limit_req zone=lunexpc_portal burst=15 nodelay;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /oauth/ {
    auth_basic off;
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:18882;
    proxy_set_header Host rikagro.ru;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    client_max_body_size 8k;
    limit_req zone=lunexpc_portal burst=15 nodelay;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
}
